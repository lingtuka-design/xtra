name = "xtra"
pages_build_output_dir = "dist"
compatibility_date = "2026-04-01"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "xtra-db"
database_id = "d382c966-7c09-40cc-aaec-33f4e417a10d"

# Environment Variables (Public defaults)
[vars]
DEFAULT_SOURCES = "David_Ornstein,footballontnt,ESPNUK,433,MadridXtra,brfootball,Squawka,UtdDistrict"

# Secrets to set via `wrangler secret put <KEY>` or Cloudflare Pages Dashboard:
# 1. GEMINI_API_KEY       -> From Google AI Studio (Free Tier)
# 2. FB_PAGE_ACCESS_TOKEN -> Meta Graph API Page Access Token (never-expiring page token)
# 3. FB_PAGE_ID           -> Facebook Page ID (e.g. 1000892348234)
# 4. CRON_SECRET          -> Secret token to protect manual or scheduled /api/sync triggers
